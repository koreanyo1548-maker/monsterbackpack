function poseOf(u){const [H,st]=HOP[u.type]||[5,14],amp=(u.hopAmp||0)*(u.boss?.6:1),ph=u.hop||0,sn=Math.sin(ph),as=Math.abs(sn),rise=Math.cos(ph)*Math.sign(sn||1),land=Math.pow(1-as,6)*.16*amp;let sy=1+.08*rise*Math.sqrt(as)*amp-land,sx=1/sy,ox=(u.kx||0),oy=(u.ky||0)-as*H*amp+(1-amp)*Math.sin(battle.time*3+u.phase)*.6,rot=sn*.06*amp;
 if(u.swing>0){const p=1-u.swing/.26,melee=u.range<=60,ex=u.atkDx??u.dir,ey=u.atkDy??0;let m;if(!melee)m=-3.5*Math.sin(p*Math.PI);else if(p<.18)m=-3*ease(p/.18);else if(p<.45)m=-3+13*ease((p-.18)/.27);else m=10*(1-ease((p-.45)/.55));ox+=ex*m;oy+=ey*m*.6;const k=melee&&m>0?m/10:0,w=melee&&p<.18?p/.18:0;sx*=1+.14*k-.06*w;sy*=1-.1*k+.06*w;}
 if(u.hurt>0){const hs=Math.sin((1-u.hurt/.18)*Math.PI)*.16;sx*=1+hs;sy*=1-hs;}
 return {ox,oy,sx,sy,rot,h:as*H*amp};}
function drawUnit(u){if(u.hp<=0&&u.deadFor>.35)return;const dying=u.hp<=0;const sz=u.boss?76:u.type==='golem'?57:u.type==='orc'?43:u.type==='slime'?35:39;const im=images[imgFor(u)];if(!im)return;const ps=poseOf(u);ctx.save();ctx.globalAlpha=(dying?Math.max(0,1-u.deadFor/.35):1)*(u._a??1);ctx.fillStyle='#12151255';ctx.beginPath();ctx.ellipse(u.x+(u.kx||0)*.5,u.y+8,sz*.3*(1-ps.h*.04),sz*.1*(1-ps.h*.04),0,0,Math.PI*2);ctx.fill();if(u.team===1&&!dying){ctx.strokeStyle=u.boss?'#f0b44c':'#e2553f';ctx.lineWidth=1.8;ctx.beginPath();ctx.ellipse(u.x,u.y+8,sz*.38,sz*.13,0,0,Math.PI*2);ctx.stroke();}ctx.translate(u.x+ps.ox,u.y+ps.oy+12);if(u.type!=='slime')ctx.scale(u.dir,1);ctx.rotate(ps.rot);ctx.scale(ps.sx,ps.sy);if(dying){const t=Math.min(1,u.deadFor/.35);ctx.rotate(t*.7*(u.dir||1));ctx.scale(1-.3*t,1-.3*t);}ctx.translate(0,-12);ctx.filter=((filterFor(u)||'')+(u.flash>.06?' brightness(2.4) saturate(.15)':u.flash>0?' brightness(1.5)':'')).trim()||'none';const dw=sz*im.width/(SPRITE_BASE_W[imgFor(u)]||im.width),h=dw*im.height/im.width,by=-h+15+(SPRITE_FOOT[imgFor(u)]||0)*dw/im.width;if(u.team===1&&!dying){const o=outlineOf(imgFor(u),u.boss?'#f0b44c':'#e2553f'),f=ctx.filter,k=dw/im.width;ctx.filter='none';ctx.drawImage(o.c,-dw/2-o.p*k,by-o.p*k,dw+2*o.p*k,h+2*o.p*k);ctx.filter=f;}ctx.drawImage(im,-dw/2,by,dw,h);ctx.filter='none';ctx.restore();if(dying)return;const bar=u.boss?60:sz*.72;ctx.fillStyle='#17191a';ctx.fillRect(u.x-bar/2-1,u.y-sz+3,bar+2,5);ctx.fillStyle=u.team===0?'#b0d474':u.boss?'#d7a64e':'#dc765f';ctx.fillRect(u.x-bar/2,u.y-sz+4,bar*Math.max(0,u.hp/u.maxHp),3);if(u.shield>0){ctx.fillStyle='#8fd2ff';ctx.fillRect(u.x-bar/2,u.y-sz+4,bar*Math.min(1,u.shield/u.maxHp),2);ctx.strokeStyle='#8fd2ffaa';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(u.x,u.y-sz*.25,sz*.42,sz*.5,0,0,7);ctx.stroke();}if(u.burn>0||u.poison>0||u.slow>0){ctx.fillStyle=u.burn>0?'#f1a045':u.poison>0?'#bd7dc9':'#7fbedc';ctx.beginPath();ctx.arc(u.x+bar/2+4,u.y-sz+5,2.5,0,7);ctx.fill();}}
function draw(){if(!battle)return;const cv=$('canvas'),k=cv.width/W,cam=battle.cam||{x:W/2,y:H/2,s:1},it=battle.intro;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1d1a1e';ctx.fillRect(0,0,cv.width,cv.height);ctx.imageSmoothingQuality='high';const shk=battle.shake||0,shx=(Math.random()-.5)*shk*2,shy=(Math.random()-.5)*shk*2;ctx.setTransform(k*cam.s,0,0,k*cam.s,k*(W/2-cam.x*cam.s+shx),k*(H/2-cam.y*cam.s+shy));if(images.battlefield)ctx.drawImage(images.battlefield,0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#15152215');grad.addColorStop(1,'#14122035');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);drawDeployGrid();for(const u of [...battle.units].sort((a,b)=>a.y-b.y)){let a=1,oy=0;if(it){if(u.team===0&&it.fly)continue;if(u.team===1){a=Math.max(0,Math.min(1,(it.t-.45)/.45));oy=-(1-a)*22;}}if(a<=0)continue;u._a=a;ctx.save();ctx.translate(0,oy);drawUnit(u);ctx.restore();}for(const p of battle.projectiles){const a=Math.atan2(p.target.y-p.y,p.target.x-p.x);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);if(p.kind==='arrow'){ctx.strokeStyle='#d8bd86';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(5,0);ctx.stroke();ctx.fillStyle='#f4dfb6';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(2,-3);ctx.lineTo(2,3);ctx.fill();}else{ctx.fillStyle=p.source.aff==='fire'?'#ffd576':'#c79ef3';ctx.shadowBlur=9;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();}ctx.restore();}for(const f of battle.fx){if(f.kind==='glow'){ctx.save();ctx.globalCompositeOperation='lighter';const gr=9+(1-f.t/f.T)*11,gg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,gr);gg.addColorStop(0,f.color+'dd');gg.addColorStop(1,f.color+'00');ctx.fillStyle=gg;ctx.globalAlpha=Math.min(1,f.t*9);ctx.beginPath();ctx.arc(f.x,f.y,gr,0,7);ctx.fill();ctx.restore();continue;}ctx.save();ctx.globalAlpha=Math.min(1,f.t*4);ctx.strokeStyle=f.kind==='fire'?'#ffb15c':f.kind==='magic'?'#c994f3':f.kind==='shield'?'#8fd2ff':f.kind==='burst'?'#b58ae0':f.kind==='heal'?'#bce581':'#fff0ca';ctx.lineWidth=2;const radius=f.kind==='death'?(1-f.t/.4)*20:(1-f.t/.4)*16;ctx.beginPath();ctx.arc(f.x,f.y,Math.max(2,radius),0,Math.PI*2);ctx.stroke();if(f.kind==='hit'){for(let k=0;k<5;k++){const a=k*1.256;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*4,f.y+Math.sin(a)*4);ctx.lineTo(f.x+Math.cos(a)*12,f.y+Math.sin(a)*12);ctx.stroke();}}ctx.restore();}for(const q of battle.parts){const a=q.t/q.T;ctx.save();ctx.globalAlpha=Math.min(1,a*1.6);if(q.add)ctx.globalCompositeOperation='lighter';ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.4,q.r*(.5+.5*a)),0,7);ctx.fill();ctx.restore();}ctx.textAlign='center';ctx.lineWidth=3/cam.s;for(const d of battle.damage){ctx.font=`bold ${(d.dot?11:15)*(1+(d.pop||0)*2.5)/cam.s}px system-ui`;ctx.globalAlpha=Math.min(1,d.t*3);ctx.strokeStyle='#292127';ctx.strokeText(d.value,d.x,d.y);ctx.fillStyle=d.color;ctx.fillText(d.value,d.x,d.y);}ctx.globalAlpha=1;}
let last=0,uiClock=0;function loop(now){const dt=Math.min(.045,(now-last)/1000||0);last=now;if(mode==='battle'&&battle){if(!paused&&!battle.end){if(battle.intro)advanceIntro(dt*speed);else{let step=dt*speed;while(step>0){let d=Math.min(step,.025);simulate(d);step-=d;}}}updateCamera(dt);draw();updateRings();if(battle.label&&!battle.intro){const L=battle.label;L.t-=dt;$('battleLabel').textContent=L.t>0?L.text:'';if(L.t<=0)battle.label=null;}uiClock+=dt;if(uiClock>.2){uiClock=0;const a=battle.units.filter(u=>u.hp>0&&u.team===0).length,e=battle.units.filter(u=>u.hp>0&&u.team===1).length;$('timer').textContent=String(Math.floor(battle.time/60)).padStart(2,'0')+':'+String(Math.floor(battle.time%60)).padStart(2,'0');$('survivors').textContent=`생존 ${a} / ${battle.allies}`;$('progress').style.width=`${100*(1-e/battle.initialEnemies)}%`;renderArmy();}}requestAnimationFrame(loop);}
function finishBattle(won){if(mode!=='battle')return;const round=state.wave,final=round===12,earned=round%4===0?12:6+Math.floor((round-1)/4);if(won){state.wins++;state.gold+=earned;state.status=final?'cleared':round%4===0?'reward':'between';}else state.status='defeated';save();modal(`<h2>${won?(final?'군단 원정 완료!':'승리!'):'원정 종료'}</h2><div class="resultArmy">${groups().slice(0,5).map(g=>pic({type:g.type,aff:g.aff})).join('')}</div>${battleReport()}<p>${won?(final?'세 지역의 보스를 모두 물리쳤습니다.':'백팩에서 만든 군단이 승리를 가져왔습니다.'):(battle.time>=60?'제한 시간 60초가 지났습니다.':'아군이 모두 쓰러졌습니다.')}</p><div class="badges"><span class="badge">${round} / 12전</span><span class="badge">처치 ${battle.stats.kills}</span><span class="badge">${Math.floor(battle.time)}초</span>${won?`<span class="badge">+${earned}G</span>`:''}</div><p class="small">${won?'모든 몬스터가 다음 전투에 완전한 체력으로 출전합니다.':'다음 원정에서 무리의 크기와 전열·후방 구성을 바꿔 보세요.'}</p><button class="action" data-action="${won&&!final?(round%4===0?'bossReward':'next'):'restart'}">${won&&!final?(round%4===0?'보스 보상 선택':'상점으로 돌아가기'):'새 원정 시작'}</button>`);beep(won?660:160,.22);}
function nextRound(){state.wave++;state.rerolls=0;state.status='playing';mode='prepare';battle=null;selected=state.board.find(p=>p&&!D[p.type].material)?.id||null;makeShop();closeModal();save();render();}
function bossReward(){modal(`<h2>보스 특별 보상</h2><p>군단의 다음 방향을 선택하세요.</p><button class="reward" data-reward="slimes">${pic({type:'slime'})}<span><b>슬라임 피스 ×2</b><small>빈칸 2개 필요 · 전투 슬라임 4마리 추가</small></span></button><button class="reward" data-reward="gold">${pic({type:'fire'})}<span><b>골드 +10G</b><small>다음 상점에서 원하는 빌드에 투자</small></span></button><button class="reward" data-reward="expand">${pic({type:'golem'})}<span><b>${BAGS[state.bag].steps[state.grown||0]?'백팩 확장':'골드 +12G'}</b><small>${BAGS[state.bag].steps[state.grown||0]?`잠긴 칸 ${BAGS[state.bag].steps[state.grown||0].length}개 해방`:'최대 크기 보유 보상'}</small></span></button><button class="reward" data-reward="cursed">${pic({type:'curse'})}<span><b>골드 +18G · 저주</b><small>저주 조각(2칸)이 가방에 들어옵니다 · 정화 4G</small></span></button>`);}
function claimReward(kind){if(state.status!=='reward')return;if(kind==='slimes'){const sa=piece('slime'),sb=piece('slime');if(!stash(sa))return toast('빈칸이 부족합니다. 다른 보상을 선택하세요');if(!stash(sb)){state.pieces=state.pieces.filter(x=>x!==sa);state.bench=state.bench.map(x=>x===sa?null:x);rebuild();return toast('빈칸이 부족합니다. 다른 보상을 선택하세요');}}else if(kind==='gold')state.gold+=10;else if(kind==='expand'){if(!expand())state.gold+=12;}else if(kind==='cursed'){const cp=piece('curse');if(!stash(cp))return toast('저주 조각을 둘 자리가 없습니다. 다른 보상을 선택하세요');state.gold+=18;}else return;nextRound();}
function help(){modal(`<h2>작은 가방, 커다란 군단</h2><ol class="helpList"><li>상점에서 구매한 피스는 빈칸에 들어갑니다.</li><li>피스를 끌거나, 선택한 뒤 빈칸을 눌러 옮기세요. 골렘·마법사·고블린처럼 여러 칸을 차지하는 피스는 <b>회전</b> 버튼(R키)으로 돌릴 수 있습니다.</li><li>종류·속성이 같은 몬스터를 상하좌우로 연결하면 무리가 됩니다.</li><li>재료를 선택한 뒤 무리를 누르면 결과를 확인하고 변이할 수 있습니다.</li><li>슬라임 1피스는 2마리로 출전합니다. 전투는 자동으로 진행됩니다.</li><li>전투 화면 아래 피스 칸의 <b>링</b>이 다음 공격(마법사는 방벽)까지의 준비 상태입니다. 마법사는 8초마다 자신과 인접 피스에 보호막을, 고블린은 인접 아군이 쓰러지면 일제 사격을, 슬라임은 쓰러질 때 독 폭발을 일으키고 연쇄가 발동하면 해당 칸이 빛납니다.</li><li>재료 두 개가 붙어서 반짝이면 하나를 다른 쪽에 끌어(또는 선택 후 탭) <b>합성</b>할 수 있습니다. 합성 정수는 불꽃+물=증기, 독+생명=역병, 불꽃+독=폭염, 물+생명=샘물이며 변이가 실패하지 않습니다. 📖 도감에서 발견한 레시피와 적을 확인하세요.</li><li>가방 위 <b>예고 줄</b>(적 아이콘)을 누르면 다음 전투의 적 구성과 약점·저항을 볼 수 있습니다. 약점 속성이 맞으면 피해 ×1.5, 저항이면 ×0.5입니다.</li><li>가방이 가득 차면 <b>벤치</b>에 보관할 수 있습니다. 벤치 피스는 전투에 나가지 않고, 선택한 뒤 가방 빈칸을 누르면 꺼냅니다.</li><li>상점 카드의 📌로 한 장을 고정하면 리롤해도 남습니다. 리롤 비용은 라운드마다 2G부터 1G씩 오릅니다.</li><li>피스 가장자리의 ▶▲▼ 화살표 방향에 닿은 피스가 보너스를 받습니다. 가방 칸의 ⚑군기·⛨방패·⚗증류 표시도 확인하세요.</li></ol><p><b>복합 변이</b><br>불꽃 + 물 → 빙염 / 독 + 생명 → 맹독 생명<br>성공률 50%(증류 칸에 올라간 무리는 75%), 실패하면 재료만 소모됩니다.</p><p class="small">3지역 · 총 12전. 4전마다 보스. 아군 전멸 또는 60초 초과 시 원정 종료. 편성은 이 브라우저에 자동 저장됩니다.</p><div class="two"><button class="action secondary" data-action="askRestart">새 원정</button><button class="action" data-action="close">알겠어요</button></div>`);}
$('shop').addEventListener('click',e=>{const pin=e.target.closest('[data-pin]');if(pin){togglePin(+pin.dataset.pin);return;}const el=e.target.closest('[data-offer]');if(el)buy(+el.dataset.offer);});$('bench').addEventListener('click',e=>{if(e.target.closest('#sellSlot')){if(mode==='prepare'&&$('overlay').hidden)sell();return;}const b=e.target.closest('[data-b]');if(b)benchTap(+b.dataset.b);});$('info').onclick=()=>{if(mode==='prepare'&&!drag&&$('overlay').hidden){infoOpen=!infoOpen;render();}};$('stow').onclick=stow;$('reroll').onclick=reroll;$('fight').onclick=startBattle;$('sell').onclick=sell;$('rotate').onclick=rotate;$('foe').onclick=()=>{if(mode==='prepare')modal(foeHTML());};$('menuBtn').onclick=()=>{if(mode==='prepare'&&$('overlay').hidden)menu();};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('battleLabel').textContent=paused?'일시정지':'';};$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent=speed+'×';};

$('board').addEventListener('pointermove',e=>{if(!drag)return;const p=state.board[drag.from];if(!p)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)drag.moved=true;if(!drag.moved)return;e.preventDefault();$('ghost').style.display='block';$('ghost').style.left=(e.clientX-40)+'px';$('ghost').style.top=(e.clientY-48)+'px';$('ghost').innerHTML=pic(p);document.querySelectorAll('.cell.target').forEach(x=>x.classList.remove('target'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');target?.classList.add('target');if(target&&D[p.type].material){const i=+target.dataset.i,r=mutationResult(drag.from,i);if(r)$('info').innerHTML=infoPanel(i,r.aff);}});
function stopDrag(e,cancel=false){if(!drag)return;const d=drag;drag=null;$('ghost').style.display='none';document.querySelectorAll('.cell.target').forEach(x=>x.classList.remove('target'));if(cancel){render();return;}const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell'),bs=d.moved?document.elementFromPoint(e.clientX,e.clientY)?.closest('.bslot'):null;if(bs){if(bs.id==='sellSlot'){const sp=state.board[d.from];if(sp){selected=sp.id;render();sell();}else render();return;}const bp=state.board[d.from],k=+bs.dataset.b;if(bp&&!state.bench[k]&&benchOK(k,bp))stowTo(bp,k);else{render();toast('그 슬롯에는 보관할 수 없습니다');}return;}if(d.moved){if(c)move(d.from,+c.dataset.i);else render();}else if(c)selectCell(+c.dataset.i);}
$('board').addEventListener('pointerup',e=>stopDrag(e));$('board').addEventListener('pointercancel',e=>stopDrag(e,true));$('board').addEventListener('click',e=>{if(e.detail===0){const c=e.target.closest('.cell');if(c)selectCell(+c.dataset.i);}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='battle'&&!battle.end){paused=true;$('pause').textContent='▶';$('battleLabel').textContent='일시정지';}});document.addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&mode==='prepare'&&$('overlay').hidden)rotate();if(e.key==='Escape'&&!$('overlay').hidden&&mode==='prepare'&&state&&state.status==='playing')closeModal();});
// Fit square cells and the original 440×540 battlefield inside the available viewport.
function fitMobile(){
 if(!state)return;
 const slot=$(mode==='prepare'?'boardSlot':'arenaSlot');if(!slot)return;
 const w=slot.clientWidth,h=slot.clientHeight;if(w<=0||h<=0)return;
 if(mode==='prepare'){
  const c=state.cols,r=state.rows,gap=3,pad=8,sx=10,sy=8;
  const rail=Math.floor(Math.min((w-pad-gap*(c-1)-sx)/(c+1),(h-pad-gap*(r-1))/r)),row=Math.floor(Math.min((w-pad-gap*(c-1))/c,(h-pad-gap*(r-1)-sy)/(r+1)));
  const useRail=rail>=row,cell=Math.max(1,useRail?rail:row),bw=cell*c+gap*(c-1)+pad,bh=cell*r+gap*(r-1)+pad,wr=$('bwrap');
  wr.classList.toggle('rail',useRail);wr.classList.toggle('row',!useRail);wr.style.setProperty('--cs',cell+'px');
  $('board').style.width=bw+'px';$('board').style.height=bh+'px';$('board').style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;
  $('bench').style.height=useRail?bh+'px':'auto';$('bench').style.width=useRail?'auto':bw+'px';
 }else{
  const scale=Math.min((w-4)/440,(h-4)/540);
  $('arena').style.width=(Math.floor(440*scale)+4)+'px';
  $('arena').style.height=(Math.floor(540*scale)+4)+'px';
  const dpr=Math.min(3,window.devicePixelRatio||1),cv=$('canvas'),bw=Math.round(Math.floor(440*scale)*dpr),bh=Math.round(Math.floor(540*scale)*dpr);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
 }
}
function viewportChanged(){
 document.documentElement.style.setProperty('--view-height',Math.floor(window.visualViewport?.height||window.innerHeight)+'px');
 requestAnimationFrame(fitMobile);
}
if(!window.__TEST__){
 window.addEventListener('resize',viewportChanged);
 window.visualViewport?.addEventListener('resize',viewportChanged);
 if(typeof ResizeObserver!=='undefined'){
  const observer=new ResizeObserver(()=>requestAnimationFrame(fitMobile));
  observer.observe($('boardSlot'));observer.observe($('arenaSlot'));
 }
 viewportChanged();
}
