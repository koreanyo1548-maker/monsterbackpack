const AFF={none:{name:'',color:'#a2b76c',effect:'같은 몬스터를 연결해 무리를 만드세요',filter:''},fire:{name:'화염 ',color:'#eb9051',effect:'공격 시 화상 · 3초 동안 초당 공격력의 20%',filter:'sepia(.35) saturate(1.7) hue-rotate(325deg)'},water:{name:'물 ',color:'#79bdd5',effect:'공격 시 2초 동안 적 공격속도 25% 감소',filter:'hue-rotate(115deg) saturate(1.3)'},poison:{name:'독 ',color:'#c28bcc',effect:'공격 시 독 · 4초 동안 초당 공격력의 10%, 3중첩',filter:'hue-rotate(215deg) saturate(1.1)'},life:{name:'생명 ',color:'#b3ce6f',effect:'3초마다 최대 체력의 3% 회복',filter:'hue-rotate(25deg) saturate(1.4)'},steam:{name:'빙염 ',color:'#83ccdc',effect:'화상과 공격속도 감소를 함께 적용',filter:'hue-rotate(155deg) saturate(1.1)'},plague:{name:'맹독 생명 ',color:'#c29bdc',effect:'독 중첩과 주기적 회복을 함께 적용',filter:'hue-rotate(225deg) saturate(1.15)'}};
