<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>몬스터 백팩 — 작은 가방, 커다란 군단</title>
<link rel="stylesheet" href="styles/main.css">
</head><body>
<main id="app">
<section id="prepare"><header><h1><small id="region"></small>전투 준비</h1><div class="hud" id="round"></div><div class="hud coin" id="gold"></div><button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button></header>
<div id="info" class="skin info compact"></div>
<div class="boardSlot" id="boardSlot"><div id="bwrap" class="bwrap rail"><div id="board" class="board" aria-label="몬스터 백팩"></div><div id="bench" class="bench" aria-label="보관"></div></div></div>
<div class="boardActions"><span id="instruction"></span><span class="acts" id="acts"><button class="pill" id="rotate" disabled>↻ 회전</button><button class="pill" id="stow" disabled>보관</button><button class="pill warn" id="sell" disabled>판매</button></span></div>
<div class="shopTitle"><b>떠돌이 상점</b><button id="reroll" class="rrbtn">리롤 2G ↻</button></div><div id="shop" class="shop"></div>
<button id="foe" class="foe" aria-label="다음 전투 예고"></button>
<footer><button id="fight" class="action">전투 시작</button></footer></section>
<section id="battle" hidden><div class="battleHud"><span class="title">자동 전투</span><b id="battleRound"></b><span id="timer" class="time">00:00</span><button id="pause" class="iconbtn" aria-label="일시정지">Ⅱ</button></div><div class="battleProgress"><div id="progress"></div></div><div class="arenaSlot" id="arenaSlot"><div class="arena" id="arena"><canvas id="canvas" width="440" height="540"></canvas><div class="battleLabel" id="battleLabel"></div></div></div><div class="skin armyPanel"><div class="armyHead"><span>내 군단</span><span id="survivors"></span></div><div class="armyList" id="army"></div></div><div class="battleFoot"><span>전투가 끝나면 모든 몬스터가 회복됩니다</span><button id="speed" class="iconbtn">1×</button></div></section>
</main><div id="overlay" class="overlay" hidden><div id="modal" class="skin modal" role="dialog" aria-modal="true"></div></div><div id="toast" class="toast" role="status"></div><div id="ghost" class="dragGhost"></div>
<script src="data/game-data.js"></script>
<script src="assets/stickers/orc/rig.js"></script>
<script src="assets/stickers/golem/rig.js"></script>
<script src="assets/stickers/goblin/rig.js"></script>
<script src="assets/stickers/skeleton/rig.js"></script>
<script src="assets/stickers/mage/rig.js"></script>
<script src="scripts/battle-sim.js"></script>
<script src="scripts/sticker-renderer.js"></script>
<script src="scripts/archer-composer.js"></script>
<script src="scripts/mage-composer.js"></script>
<script src="scripts/run-rules.js"></script>
<script src="scripts/state.js"></script>
<script src="scripts/bag.js"></script>
<script src="scripts/encounter.js"></script>
<script src="scripts/codex.js"></script>
<script src="scripts/sprites.js"></script>
<script src="scripts/prepare.js"></script>
<script src="scripts/battle.js"></script>
<script src="scripts/battle-fx.js"></script>
<script src="scripts/battle-view.js"></script>
<script src="scripts/main.js"></script>
</body></html>
